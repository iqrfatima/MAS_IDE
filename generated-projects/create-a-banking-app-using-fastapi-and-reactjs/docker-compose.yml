version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    env_file:
      - .env.example
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      - db
    env_file:
      - .env.example
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    env_file:
      - .env.example
    ports:
      - "80:80"

volumes:
  postgres_data:
