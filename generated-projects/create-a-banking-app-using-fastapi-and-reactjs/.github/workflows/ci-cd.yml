name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job for backend: linting, testing, building Docker image
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
        # Cache dependencies based on the root-level requirements.txt
        cache-dependency-path: 'requirements.txt'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      # No working-directory here as requirements.txt is at root

    - name: Run backend linting (Flake8)
      run: |
        pip install flake8  # Install linter
        flake8 src/         # Assumes backend src is in the root-level src/ directory

    - name: Run backend tests
      # Assumes pytest is installed and tests are structured within src/
      run: |
        pip install pytest  # Install testing framework
        pytest src/         # Run tests in the root-level src/ directory

    - name: Build backend Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile
        push: false # Set to true for actual push to a registry (e.g., ghcr.io, Docker Hub)
        tags: banking-app-backend:${{ github.sha }}
        # For runtime secrets, typically environment variables are passed at container startup.
        # Build-time secrets are rare for application configuration.
        # secrets: | 
        #   "DATABASE_URL=${{ secrets.DATABASE_URL }}"

    - name: Security Scan Backend Image (Trivy Placeholder)
      run: echo "Running security scan on banking-app-backend:${{ github.sha }}... (e.g., Trivy Action)"
      # For a real scan, integrate with a tool like Aqua Security Trivy Action:
      # - uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: 'banking-app-backend:${{ github.sha }}'
      #     format: 'table'
      #     exit-code: '1'
      #     ignore-unfixed: true
      #     vuln-type: 'os,library'
      #     severity: 'CRITICAL,HIGH'

  # Job for frontend: linting, testing, building Docker image
  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        # Cache dependencies based on frontend/package-lock.json
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install frontend dependencies
      run: npm ci
      working-directory: ./frontend

    - name: Run frontend linting (ESLint)
      run: npm run lint
      working-directory: ./frontend

    - name: Run frontend tests (e.g., Vitest/Jest)
      # Ensure your package.json has a 'test' script configured for non-interactive running.
      run: npm test
      working-directory: ./frontend

    - name: Build frontend Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: frontend/Dockerfile
        push: false # Set to true for actual push to a registry
        tags: banking-app-frontend:${{ github.sha }}

    - name: Security Scan Frontend Image (Trivy Placeholder)
      run: echo "Running security scan on banking-app-frontend:${{ github.sha }}... (e.g., Trivy Action)"

  # Job for deployment to a staging environment (simplified for CI validation)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend] # Ensure both backend and frontend images are built successfully
    environment: staging # Designate environment for GitHub deployments, enables environment protection rules
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Create .env for local Docker Compose validation
      # For this validation step, we'll create a dummy .env file.
      # In a real deployment, secrets would be injected securely (e.g., Kubernetes secrets, AWS Secrets Manager).
      run: |
        cp .env.example .env
        echo "POSTGRES_DB=test_db" >> .env
        echo "POSTGRES_USER=test_user" >> .env
        echo "POSTGRES_PASSWORD=test_password" >> .env
        echo "DATABASE_URL=postgresql+asyncpg://test_user:test_password@db:5432/test_db" >> .env
        echo "SECRET_KEY=dummy_ci_secret_key_for_testing_only" >> .env
        echo "ALGORITHM=HS256" >> .env
        echo "ACCESS_TOKEN